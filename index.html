<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Focus Pomodoro</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Hi, <span id="user-name">{#name}</span>! 👋</h1>
    <div class="task-list-wrapper">
        <ul class="task-list">
            <li class="task-list__item task-item">
                <div class="task-item__wrapper">
                    <div class="task-item__text">
                        task 1
                    </div>
                    <div class="task-item__time">
                        00:00:00
                    </div>
                </div>
                <div class="task-item__controll">
                    <div class="task-item__btn task-item__play-pause">
                        &gt;
                    </div>
                    <div class="task-item__btn task-item__done">
                        Done
                    </div>
                </div>
            </li>
            <li class="task-list__item task-item">
                <div class="task-item__wrapper">
                    <div class="task-item__text">
                        task 2
                    </div>
                    <div class="task-item__time">
                        00:00:00
                    </div>
                </div>
                <div class="task-item__controll">
                    <div class="task-item__btn task-item__play-pause">
                        &gt;
                    </div>
                    <div class="task-item__btn task-item__done">
                        Done
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="add-task-wrapper">
        <button class="add-task">
            + add task
        </button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
