<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Focus Pomodoro</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Hi, <span id="user-name">{#name}</span>! 👋</h1>
    <div class="task-list-wrapper">
        <ul class="task-list">
            <li class="task-list__item task-item">
                <div class="task-item__wrapper">
                    <div class="task-item__text">
                        task 1
                    </div>
                    <div class="task-item__time">
                        00:00:00
                    </div>
                </div>
                <div class="task-item__controll">
                    <div class="task-item__btn task-item__play-pause">
                        <img height="16" width="16" class="task-item__icon" src="./assets/play.svg" alt="">
                        <span class="task-item__icon-description">Start</span>
                    </div>
                    <div class="task-item__btn task-item__done">
                        <img height="16" width="16" class="task-item__icon" src="./assets/check-square.svg" alt="">
                        <span class="task-item__icon-description">Done</span>
                    </div>
                    <div class="task-item__btn task-item__delete">
                        <img height="16" width="16" class="task-item__icon" src="./assets/trash.svg" alt="">
                        <span class="task-item__icon-description">Delete</span>
                    </div>
                </div>
            </li>
            <li class="task-list__item task-item">
                <div class="task-item__wrapper">
                    <div class="task-item__text">
                        task 2
                    </div>
                    <div class="task-item__time">
                        00:00:00
                    </div>
                </div>
                <div class="task-item__controll">
                    <div class="task-item__btn task-item__play-pause">
                        <img height="16" width="16" class="task-item__icon" src="./assets/play.svg" alt="">
                        <span class="task-item__icon-description">Start</span>
                    </div>
                    <div class="task-item__btn task-item__done">
                        <img height="16" width="16" class="task-item__icon" src="./assets/check-square.svg" alt="">
                        <span class="task-item__icon-description">Done</span>
                    </div>
                    <div class="task-item__btn task-item__delete">
                        <img height="16" width="16" class="task-item__icon" src="./assets/trash.svg" alt="">
                        <span class="task-item__icon-description">Delete</span>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="add-task-wrapper">
        <button class="add-task">
            + ADD TASK
        </button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
